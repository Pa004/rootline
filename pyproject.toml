[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rootline"
version = "0.2.0"
description = "Trace the change. Find the cause."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Pablo Domínguez" }]
keywords = ["debugging", "causal-analysis", "git", "regression"]
urls = { repository = "https://github.com/Pa004/rootline" }
dependencies = [
  "rootline-core",
  "rootline-cli",
  "rootline-api",
  "rootline-mcp",
  "pyyaml>=6.0",
]

[tool.uv.sources]
rootline-core = { workspace = true }
rootline-cli = { workspace = true }
rootline-api = { workspace = true }
rootline-mcp = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.4.0",
  "mypy>=1.10",
  "types-networkx>=3.0",
  "httpx>=0.27",
]

[tool.uv.workspace]
members = ["packages/*", "apps/api"]

[tool.hatch.build.targets.wheel]
# Root ships the `python -m rootline` shim; code lives in members.
packages = ["src/rootline"]

[tool.ruff]
target-version = "py313"
line-length = 100
# workers/ is a separate pywrangler env (vendored deps live there).
exclude = ["workers"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
